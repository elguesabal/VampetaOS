<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VampetaOS</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #090d12;
			color: #c9d1d9;
			font-family: monospace;
		}

		main {
			width: 90%;
			max-width: 600px;
			padding: 24px;
			border: 1px solid #30363d;
			border-radius: 8px;
		}

		header, footer {
			color: #8b949e;
			font-size: 12px;
		}

		header {
			padding-bottom: 16px;
			border-bottom: 1px solid #30363d;
		}

		section {
			padding: 48px 0;
			text-align: center;
		}

		h1 {
			margin: 0;
			color: #f85149;
			font-size: 72px;
		}

		h2 {
			color: #ffffff;
		}

		p {
			color: #8b949e;
			line-height: 1.6;
		}

		footer {
			padding-top: 16px;
			border-top: 1px solid #30363d;
		}

		.prompt {
			color: #58a6ff;
		}
	</style>
</head>
<body>
	<main>
		<header>
			VampetaOS / HTTP SERVER
		</header>
		<section>
			<h1>404</h1>
			<h2>Page Not Found</h2>
			<p>The requested resource could not be found on this server.</p>
		</section>
		<footer>
			<span class="prompt">elguesabal@VampetaOS:~$</span>
			<br><br>
			VampetaOS HTTP Server
		</footer>
	</main>
</body>
</html>
